# Which stock Nothing OS overlay values are carried over to the GSI.
#
# Format: <target package> <allowed resource types> <name regex>
# Types are a comma list of: bool, integer, dimen, array, string.
#
# Only hardware-description values belong here. Anything that points at
# Nothing's own apps or services (component names, package names, theming)
# must stay out: those apps do not exist on the GSI and would break things.

# Display: cutout shape, rounded corners, status bar sizing around the punch hole
android     string              ^config_mainBuiltInDisplayCutout(RectApproximation)?$
android     bool                ^config_(fill|mask)MainBuiltInDisplayCutout$
android     dimen               ^(rounded_corner_radius.*|status_bar_height.*|quick_qs_offset_height|navigation_bar_.*height.*)$

# Brightness and ambient light: panel range, auto-brightness curve, thresholds
android     bool,integer,dimen,array   ^config_(screenBrightness|autoBrightness|brightness|ambient|minimumScreenOffTimeout).*$
android     bool,integer,dimen,array   ^config_(displayWhiteBalance|nightDisplay|evenDimmer).*$

# Refresh rate
android     integer,dimen,array ^config_(defaultPeakRefreshRate|defaultRefreshRate|defaultRefreshRateInZone|refreshRate.*)$

# Always-on display and doze sensors (not the doze component itself)
android     bool,integer        ^config_(dozeAlwaysOnDisplayAvailable|dozeSupportsAodWallpaper|dozePulsePickup|dozeWakeLockScreenSensorAvailable|displayBlanksAfterDoze|supportDoubleTapWake|supportsTapToWake)$

# Fingerprint sensor (under-display, optical)
android     bool,integer,dimen,array   ^config_(udfps|sfps|fingerprint).*$

# Haptics
android     bool,integer,dimen,array   ^config_(vibrat|haptic|virtualKeyVibePattern|longPressVibePattern|keyboardTapVibePattern).*$

# Battery and charging indicators
android     integer             ^config_(lowBatteryWarningLevel|lowBatteryCloseWarningBump|criticalBatteryWarningLevel)$

# SystemUI: corners, punch-hole padding, fingerprint icon placement
com.android.systemui  dimen,integer,bool,array  ^(rounded_corner.*|status_bar_padding.*|physical_.*button.*|udfps_.*|config_udfps.*|config_enableDisplayCutoutProtection|config_.*Cutout.*)$
